<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font); background: var(--backdrop); color: var(--text); padding: 20px; }
  .cols { display: grid; grid-template-columns: 330px 330px; gap: 24px; align-items: start; }
  .lbl { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-bottom: 8px; }
  .stack > * { margin-bottom: 8px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Toggle, UrlField } = window.CleanURLDesignSystem_814f5d;
    function Demo() {
      const [a, setA] = React.useState(true);
      const [b, setB] = React.useState(false);
      return (
        <div className="cols">
          <div className="stack">
            <div className="lbl">Toggle — checked / unchecked / long string / disabled</div>
            <Toggle label="Remove UTM (utm_*)" checked={a} onChange={setA} />
            <Toggle label="Remove click IDs (gclid, fbclid, …)" checked={b} onChange={setB} />
            <Toggle label="Ref/Tracking entfernen (ref, igshid, mc_*, …)" checked />
            <Toggle label="Remove text fragments (#:~:text=)" checked disabled />
          </div>
          <div className="stack">
            <div className="lbl">UrlField — original / cleaned (focus for ring)</div>
            <UrlField label="Original URL" value="https://example.com/article?utm_source=news&utm_medium=email&gclid=abc123" />
            <UrlField label="Clean URL" value="https://example.com/article" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
