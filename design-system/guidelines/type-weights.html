<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--backdrop); color: var(--text); padding: 20px; }
  .row { display:flex; gap: 20px; flex-wrap: wrap; align-items: baseline; }
  .w { font-size: 20px; }
  .lbl { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-top: 4px; }
  .col { text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="w" style="font-weight:400">Aa</div><div class="lbl">400 regular</div></div>
    <div class="col"><div class="w" style="font-weight:600">Aa</div><div class="lbl">600 medium</div></div>
    <div class="col"><div class="w" style="font-weight:650">Aa</div><div class="lbl">650 section</div></div>
    <div class="col"><div class="w" style="font-weight:700">Aa</div><div class="lbl">700 title</div></div>
    <div class="col"><div class="w" style="font-weight:800">Aa</div><div class="lbl">800 button</div></div>
    <div class="col" style="margin-left:auto"><div class="w" style="font-family:var(--font-mono)">?utm_source=x</div><div class="lbl">mono · URL fields</div></div>
  </div>
</body>
</html>
