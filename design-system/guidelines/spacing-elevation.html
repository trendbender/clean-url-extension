<!-- @dsCard group="Spacing" viewport="700x170" name="Radius, elevation & glass" subtitle="Corner radii, shadows, and the blur recipe" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--backdrop); color: var(--text); padding: 20px; }
  .row { display:flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .box { width: 120px; height: 70px; background: var(--card); border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .glass { background: var(--card-glass); backdrop-filter: blur(10px); }
  .name { font-size: 12px; font-weight: 650; margin-top: 8px; }
  .sub { font-size: 10.5px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }
  .col { width: 120px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:14px"></div><div class="name">radius</div><div class="sub">14px · cards/btn</div></div>
    <div class="col"><div class="box" style="border-radius:12px"></div><div class="name">radius-input</div><div class="sub">12px · fields</div></div>
    <div class="col"><div class="box" style="border-radius:10px; background:var(--grad-logo)"></div><div class="name">radius-logo</div><div class="sub">10px · @34px</div></div>
    <div class="col"><div class="box" style="border-radius:14px; box-shadow:var(--shadow); border:none"></div><div class="name">shadow</div><div class="sub">0 10 30 /.35</div></div>
    <div class="col"><div class="box glass" style="border-radius:14px; box-shadow:var(--shadow-card)"></div><div class="name">glass + card</div><div class="sub">blur(10) /.72</div></div>
  </div>
</body>
</html>
