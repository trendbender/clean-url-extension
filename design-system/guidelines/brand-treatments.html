<!-- @dsCard group="Brand" viewport="700x220" name="Icon applications & toolbar treatments" subtitle="The chosen CU mark on dark, as favicon, mono & success badge" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--backdrop); color: var(--text); padding: 20px; }
  .row { display:flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
  .col { text-align: center; width: 128px; }
  .name { font-size: 12px; font-weight: 650; margin-top: 12px; }
  .sub { font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .chrome { width: 64px; height: 64px; border-radius: 12px; background: #1c1c1e; display:flex; align-items:center; justify-content:center; margin: 0 auto; }
  .dark { width: 64px; height: 64px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; margin: 0 auto; }
  .favi { display:flex; gap: 10px; align-items:flex-end; justify-content:center; }
  img { display:block; margin: 0 auto; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="dark"><img src="../assets/logo-cu.svg" width="44" height="44" alt="On dark" /></div><div class="name">On dark surface</div><div class="sub">Header / popup — 34px in-product</div></div>
    <div class="col"><div class="favi"><img src="../assets/logo-cu.svg" width="32" height="32" alt="Favicon 32" /><img src="../assets/logo-cu.svg" width="16" height="16" alt="Favicon 16" /></div><div class="name">Favicon · 32 / 16</div><div class="sub">Full monogram scales down cleanly</div></div>
    <div class="col"><div class="chrome"><img src="../assets/toolbar-mono.svg" width="34" height="34" alt="Mono toolbar" /></div><div class="name">Toolbar · mono</div><div class="sub">Single-color glyph for the browser bar</div></div>
    <div class="col"><img src="../assets/toolbar-badge.svg" width="64" height="64" alt="Badge toolbar" /><div class="name">Toolbar · badge</div><div class="sub">Green ✓ after a successful copy</div></div>
  </div>
</body>
</html>
