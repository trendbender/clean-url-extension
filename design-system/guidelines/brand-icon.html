<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--backdrop); color: var(--text); padding: 20px; }
  .row { display:flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .col { text-align: center; }
  .lbl { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-top: 10px; }
  img { display:block; }
  .cap { font-size: 12px; color: var(--muted); margin-top: 14px; max-width: 300px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><img src="../assets/logo-cu.svg" width="128" height="128" alt="CU 128" /><div class="lbl">128px</div></div>
    <div class="col"><img src="../assets/logo-cu.svg" width="48" height="48" alt="CU 48" /><div class="lbl">48px</div></div>
    <div class="col"><img src="../assets/logo-cu.svg" width="32" height="32" alt="CU 32" /><div class="lbl">32px</div></div>
    <div class="col"><img src="../assets/logo-cu.svg" width="16" height="16" alt="CU 16" /><div class="lbl">16px</div></div>
    <div class="cap">The "CU" monogram in near-black on the blue→mint gradient. Bold, tight tracking keeps both letters legible down to 16px.</div>
  </div>
</body>
</html>
