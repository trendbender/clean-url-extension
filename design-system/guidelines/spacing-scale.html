<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="2 → 14px · popup rhythm" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--backdrop); color: var(--text); padding: 20px; }
  .row { display:flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .col { text-align:center; }
  .bar { background: var(--grad-logo); border-radius: 4px; width: 22px; }
  .lbl { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:2px"></div><div class="lbl">2</div></div>
    <div class="col"><div class="bar" style="height:6px"></div><div class="lbl">6</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="lbl">8</div></div>
    <div class="col"><div class="bar" style="height:10px"></div><div class="lbl">10 · card pad</div></div>
    <div class="col"><div class="bar" style="height:14px"></div><div class="lbl">14 · edge pad</div></div>
  </div>
</body>
</html>
